# Права на детализацию и режим данных (контракт BACKEND.md, раздел «Идентификаторы»).
#
# dataMode: demo | real — режим запуска (фикстуры/синтетика против реальных данных).
# Личность: с 5 участниками одного псевдонима недостаточно для защиты —
# разрешение на показ ЧИСЛОВОЙ истории и ТЕКСТОВ проверяется отдельно.

data_mode: demo

detail_permissions:
  # Персональные срезы по internId/mentorId в /metrics и /feedback.
  # Разрешить только после подтверждения надёжной связи «ответ → человек» (WP7).
  personal_slices_allowed: false

  # Числовая индивидуальная история стажёра.
  numeric_history_allowed: false

  # Показ текстовых комментариев в дашборде.
  text_display_allowed: false

# Минимальный объём данных для выводов (сигналы, AI-сводки) — этап 2.
min_sample_for_insights: 3

# Права на детализацию (контракт BACKEND.md, раздел «Идентификаторы»).
# Личность: с 5 участниками одного псевдонима недостаточно для защиты —
# разрешение на показ ЧИСЛОВОЙ истории и ТЕКСТОВ проверяется отдельно.
# dataMode (demo|real) задаётся переменной MGTS_DATA_MODE (см. .env.example).

# Персональные срезы по internId/mentorId в /metrics и /feedback.
# Разрешить только после подтверждения надёжной связи «ответ → человек» (WP7).
personal_slices_allowed: false

# Числовая индивидуальная история стажёра (персональные срезы /metrics).
numeric_history_allowed: false

# Показ текстовых комментариев в /feedback.
# В demo-режиме синтетические комментарии показываются автоматически;
# в real-режиме этот флаг — единственное, что разрешает показ.
text_display_allowed: false

# План ответов на цикл (для coverage.expected в /metrics).
# null — план неизвестен: фронт не показывает процент охвата.
expected_per_cycle:
  intern: 5
  mentor: 5

# Минимальный объём данных для выводов (сигналы, AI-сводки) — этап 2.
min_sample_for_insights: 3
